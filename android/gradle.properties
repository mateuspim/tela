# Sized for the machine this actually builds on, not for a build server.
#
# This was `-Xmx8G -XX:MaxMetaspaceSize=4G`, which is more memory than the host
# has: 6 GB of RAM and 2 GB of swap. The JVM treats Xmx as permission to grow,
# so a Kotlin compile would expand into swap and take the whole box with it —
# the build appeared to hang rather than to fail, twice, because a thrashing
# host cannot report anything (owner, 2026-08-12).
#
# 2 GB heap builds this project with room to spare; the release APK's R8 pass is
# the heaviest thing here and fits. The Kotlin compiler runs in its **own**
# daemon with its own heap, so it is capped separately — leaving it unset is how
# a second JVM quietly doubles the total. Both together, plus Gradle's overhead,
# stay under the container limit `tool/tela` imposes.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m

# Two workers, not one per core: each fork is a JVM, and on a 6 GB host the
# parallelism costs more in resident memory than it returns in wall clock.
org.gradle.workers.max=2

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
