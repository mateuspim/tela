<script>
        function switchTab(tab) {
            const publicBtn = document.getElementById('tab-public');
            const privateBtn = document.getElementById('tab-private');
            const publicView = document.getElementById('view-public');
            const privateView = document.getElementById('view-private');

            if (tab === 'public') {
                publicBtn.className = 'flex-1 py-3 text-center font-label-md tab-active transition-colors flex items-center justify-center gap-2';
                privateBtn.className = 'flex-1 py-3 text-center font-label-md tab-inactive transition-colors flex items-center justify-center gap-2 group relative';
                
                publicView.classList.remove('hidden');
                // Small delay to allow display:block to apply before fading in
                setTimeout(() => publicView.classList.remove('opacity-0'), 10);
                
                privateView.classList.add('opacity-0');
                setTimeout(() => privateView.classList.add('hidden'), 300);

            } else {
                privateBtn.className = 'flex-1 py-3 text-center font-label-md tab-active transition-colors flex items-center justify-center gap-2';
                publicBtn.className = 'flex-1 py-3 text-center font-label-md tab-inactive transition-colors flex items-center justify-center gap-2';
                
                privateView.classList.remove('hidden');
                setTimeout(() => privateView.classList.remove('opacity-0'), 10);
                
                publicView.classList.add('opacity-0');
                setTimeout(() => publicView.classList.add('hidden'), 300);
            }
        }
    </script>
