<style>

<body class="bg-background text-on-background font-body-lg h-screen w-screen overflow-hidden selection:bg-primary selection:text-on-primary">

</div>
<!-- Top Navigation (Back Button) -->
<div class="fixed top-0 left-0 w-full z-10 px-margin-mobile py-sm mt-4 flex items-center justify-between pointer-events-none">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface/40 backdrop-blur-md text-on-surface hover:bg-surface/60 transition-colors pointer-events-auto action-button-pop">
<span class="material-symbols-outlined" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<!-- Optional: Share button or other top-right action could go here if needed, keeping it minimal for now -->
</div>
<!-- Interactive Layer / Tap to dismiss UI -->
<div aria-label="Tap to toggle UI visibility" class="absolute inset-0 z-0 cursor-pointer" id="immersive-toggle"></div>
<!-- Bottom Sheet UI -->
<div class="fixed bottom-0 w-full z-20 flex flex-col justify-end pointer-events-none transition-opacity duration-300" id="ui-overlay">
<!-- Main Info Card -->
<div class="glass-panel w-full rounded-t-[32px] pt-lg pb-xl px-margin-mobile flex flex-col gap-md pointer-events-auto shadow-[0_-10px_40px_rgba(0,0,0,0.3)] fade-in-up">
<!-- Handle -->
<div class="w-full flex justify-center mb-sm">
<div class="w-12 h-1.5 rounded-full bg-outline-variant/50"></div>
</div>
<!-- Header: Title & Actions -->
<div class="flex items-start justify-between">
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Neon Rain</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">by StudioMirai</p>
</div>
<div class="flex items-center gap-sm">
<button aria-label="Favorite" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest text-on-surface hover:bg-surface-variant transition-colors action-button-pop" id="favorite-btn">
<span class="material-symbols-outlined" data-icon="favorite" id="favorite-icon" style="font-variation-settings: 'FILL' 0;">favorite</span>
</button>
<button aria-label="Download" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest text-on-surface hover:bg-surface-variant transition-colors action-button-pop">
<span class="material-symbols-outlined" data-icon="download" style="font-variation-settings: 'FILL' 0;">download</span>
</button>
</div>
</div>
<!-- Metadata Row -->
<div class="flex flex-wrap gap-x-md gap-y-sm mt-xs">
<div class="flex items-center gap-xs font-label-md text-label-md text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]" data-icon="aspect_ratio">aspect_ratio</span>
                    2160x3840
                </div>
<div class="flex items-center gap-xs font-label-md text-label-md text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]" data-icon="hard_drive">hard_drive</span>
                    4.2 MB
                </div>
<div class="flex items-center gap-xs font-label-md text-label-md text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]" data-icon="category">category</span>
                    Anime

<span class="material-symbols-outlined text-[16px]" data-icon="verified_user">verified_user</span>
                    SFW

<!-- Color Swatches -->
<div class="mt-sm">

<div class="flex gap-sm hide-scrollbar overflow-x-auto pb-1">

<div aria-label="Color swatch #D1F2EB" class="w-8 h-8 rounded-full border border-outline-variant/30 flex-shrink-0" style="background-color: #D1F2EB;"></div>
<div aria-label="Color swatch #5B0017" class="w-8 h-8 rounded-full border border-outline-variant/30 flex-shrink-0" style="background-color: #5B0017;"></div>
</div>
</div>
<!-- Tags -->
<div class="mt-xs">
<div class="flex flex-wrap gap-sm">
<span class="px-3 py-1 rounded-full bg-surface-container-low text-on-surface font-label-sm text-label-sm border border-outline-variant/20">Cyberpunk</span>
<span class="px-3 py-1 rounded-full bg-surface-container-low text-on-surface font-label-sm text-label-sm border border-outline-variant/20">Cityscape</span>
<span class="px-3 py-1 rounded-full bg-surface-container-low text-on-surface font-label-sm text-label-sm border border-outline-variant/20">Rain</span>

<!-- Primary Action -->
<button class="w-full mt-sm py-4 rounded-full bg-primary text-on-primary font-title-md text-title-md flex items-center justify-center gap-sm hover:bg-primary-fixed transition-colors shadow-md action-button-pop" id="set-wallpaper-btn">
<span class="material-symbols-outlined" data-icon="wallpaper">wallpaper</span>

            </button>
</div>

<!-- Set Wallpaper Sub-Sheet (Hidden by default) -->
<div class="fixed inset-0 z-30 bg-surface/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col justify-end" id="set-options-sheet">
<div class="bg-surface-container-high w-full rounded-t-[32px] pt-lg pb-xl px-margin-mobile flex flex-col gap-sm transform translate-y-full transition-transform duration-300" id="set-options-content">

<div class="w-12 h-1.5 rounded-full bg-outline-variant"></div>
</div>
<h2 class="font-title-md text-title-md text-on-surface mb-md px-2">Set Wallpaper As...</h2>
<button class="w-full py-4 px-md rounded-2xl bg-surface-container flex items-center gap-md hover:bg-surface-variant transition-colors action-button-pop text-left">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="home">home</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface flex-grow">Home Screen</span>
</button>
<button class="w-full py-4 px-md rounded-2xl bg-surface-container flex items-center gap-md hover:bg-surface-variant transition-colors action-button-pop text-left">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="screen_lock_portrait">screen_lock_portrait</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface flex-grow">Lock Screen</span>
</button>
<button class="w-full py-4 px-md rounded-2xl bg-primary-container text-on-primary-container flex items-center gap-md hover:opacity-90 transition-opacity action-button-pop text-left mt-2">
<div class="w-10 h-10 rounded-full bg-on-primary-container/10 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="phone_android">phone_android</span>
</div>
<span class="font-title-md text-title-md flex-grow">Both Screens</span>
</button>
<button class="w-full mt-4 py-3 rounded-full text-primary font-label-md text-label-md text-center hover:bg-surface-variant/50 transition-colors" id="cancel-set-btn">
                Cancel
            </button>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const uiOverlay = document.getElementById('ui-overlay');
            const immersiveToggle = document.getElementById('immersive-toggle');
            const topNav = document.querySelector('.fixed.top-0');
            const favoriteBtn = document.getElementById('favorite-btn');
            const favoriteIcon = document.getElementById('favorite-icon');
            
            const setWallpaperBtn = document.getElementById('set-wallpaper-btn');
            const setOptionsSheet = document.getElementById('set-options-sheet');
            const setOptionsContent = document.getElementById('set-options-content');
            const cancelSetBtn = document.getElementById('cancel-set-btn');

            let isUIVisible = true;
            let isFavorited = false;

            // Toggle Immersive Mode
            immersiveToggle.addEventListener('click', () => {
                isUIVisible = !isUIVisible;
                if (isUIVisible) {
                    uiOverlay.style.opacity = '1';
                    uiOverlay.style.pointerEvents = 'none'; // container none, children auto
                    uiOverlay.children[0].style.pointerEvents = 'auto';
                    topNav.style.opacity = '1';
                    topNav.style.pointerEvents = 'none';
                    topNav.children[0].style.pointerEvents = 'auto';
                } else {
                    uiOverlay.style.opacity = '0';
                    uiOverlay.children[0].style.pointerEvents = 'none';
                    topNav.style.opacity = '0';
                    topNav.children[0].style.pointerEvents = 'none';
                }
            });

            // Toggle Favorite
            favoriteBtn.addEventListener('click', () => {
                isFavorited = !isFavorited;
                if (isFavorited) {
                    favoriteIcon.style.fontVariationSettings = "'FILL' 1";
                    favoriteIcon.classList.add('text-tertiary-container');
                } else {
                    favoriteIcon.style.fontVariationSettings = "'FILL' 0";
                    favoriteIcon.classList.remove('text-tertiary-container');
                }
                
                // Pop animation
                favoriteBtn.style.transform = 'scale(0.8)';
                setTimeout(() => {
                    favoriteBtn.style.transform = 'scale(1)';
                }, 150);
            });

            // Show Set Wallpaper Options
            setWallpaperBtn.addEventListener('click', () => {
                setOptionsSheet.classList.remove('opacity-0', 'pointer-events-none');
                setOptionsSheet.classList.add('opacity-100', 'pointer-events-auto');
                
                setTimeout(() => {
                    setOptionsContent.classList.remove('translate-y-full');
                    setOptionsContent.classList.add('translate-y-0');
                }, 50);
            });

            // Hide Set Wallpaper Options
            const hideOptions = () => {
                setOptionsContent.classList.remove('translate-y-0');
                setOptionsContent.classList.add('translate-y-full');
                
                setTimeout(() => {
                    setOptionsSheet.classList.remove('opacity-100', 'pointer-events-auto');
                    setOptionsSheet.classList.add('opacity-0', 'pointer-events-none');
                }, 300);
            };

            cancelSetBtn.addEventListener('click', hideOptions);
            
            // Close sheet when clicking backdrop
            setOptionsSheet.addEventListener('click', (e) => {
                if (e.target === setOptionsSheet) {
                    hideOptions();
                }
            });
        });
    </script>
